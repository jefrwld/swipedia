<div class="main-wrapper">
  <div *ngIf="article()" class="article-content">
    
    <!-- Bild anzeigen, falls vorhanden -->
     <div class="article-image-wrapper">
      <img class="article-image" *ngIf="article().thumbnail" [src]="article().thumbnail.source" [alt]="article().title">
     </div>

    <h2 class="title">{{ article().title }}</h2>
    <div class="article-text-content">
      <p>{{ article().extract }}</p>
    </div>

  </div>
    <div class="card-buttons">
      <button (click)="dontLike()">No</button>
    <a [href]="'https://en.wikipedia.org/wiki/' + article().title" target="_blank">Read more</a>
      <button (click)="like()">Yes</button>
    </div>
</div>
